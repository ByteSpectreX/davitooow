/* DVendo Uptime styles. Inline style attributes are blocked by the CSP,
   so dynamic widths are applied from app.js through element.style. */
:root{
  --brand:#b10818; --brand-600:#8f0612; --brand-50:#fdecee;
  --brand-grad:linear-gradient(135deg,#dc1a30 0%,#b10818 55%,#7a0410 100%);
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f7f8fa; --border:#e4e6eb;
  --text:#1b1d22; --muted:#5f6b7d; --faint:#98a2b3;
  --crit:#d92d20; --crit-bg:#fef3f2; --warn:#f97316; --warn-text:#c2410c; --warn-bg:#fff4ed;
  --ok:#16a34a; --ok-text:#15803d;
  --radius:16px; --shadow:0 1px 2px rgb(16 24 40/6%),0 4px 16px rgb(16 24 40/6%);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme=dark]{
  --bg:#0e1015; --surface:#171a21; --surface-2:#1e222b; --border:#2a2f3a;
  --text:#eef0f4; --muted:#a3abbb; --faint:#6b7385; --brand-50:#3a0d13;
  --crit:#f97066; --warn:#fb923c; --warn-text:#fdba74; --crit-bg:#2d1414; --warn-bg:#2b1a0e; --ok:#22c55e; --ok-text:#4ade80;
  --shadow:0 1px 2px rgb(0 0 0/30%),0 6px 20px rgb(0 0 0/25%);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select{font:inherit;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--muted)}

/* Status palettes */
.st-critical{--s:var(--crit);--sbg:var(--crit-bg)}
.st-warning{--s:var(--warn);--st:var(--warn-text);--sbg:var(--warn-bg)}
.st-ok{--s:transparent;--sbg:transparent}
.st-auth{--s:var(--muted);--sbg:var(--surface-2)}
.lvl-critical{background:var(--crit)} .lvl-warning{background:var(--warn)} .lvl-ok{background:var(--ok)}
.flag{font-size:.8rem;font-weight:650;color:var(--st,var(--s));white-space:nowrap}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:10px 16px;font-weight:650;cursor:pointer;background:var(--brand);color:#fff;transition:background .15s,transform .1s;white-space:nowrap;min-height:42px}
.btn:hover{background:var(--brand-600)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:6px 11px;font-size:.85rem;min-height:34px}
.btn.block{width:100%}
.btn.icon{padding:8px;min-height:38px;min-width:38px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface);min-height:42px}
.input:focus{border-color:var(--brand);outline:3px solid color-mix(in srgb,var(--brand) 18%,transparent)}
.field{display:block;margin:14px 0 0}
.field>span{display:block;font-size:.85rem;font-weight:650;margin-bottom:6px;color:var(--muted)}
.form-err{color:var(--crit);font-weight:600;font-size:.9rem;margin:10px 0 0;min-height:1.2em}
.input.input-error{border-color:var(--crit);outline:3px solid color-mix(in srgb,var(--crit) 18%,transparent)}
.field-status{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:.84rem;font-weight:600;min-height:1.1em}
.field-status svg{width:16px;height:16px;flex:0 0 auto}
.field-status.hidden{display:none}
.field-status.is-checking{color:var(--muted);font-weight:500}
.field-status.is-ok{color:var(--ok-text)}
.field-status.is-error{color:var(--crit)}
.drawer-edit{width:200px;max-width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);text-align:right;font:inherit}
.drawer-edit:focus{border-color:var(--brand);outline:2px solid color-mix(in srgb,var(--brand) 18%,transparent)}
.choice-card.is-disabled{opacity:.55;cursor:not-allowed}
.tag-off{color:var(--muted);font-weight:600}
.pass-wrap{position:relative}
.pass-wrap .input{padding-right:44px}
.pass-toggle{position:absolute;top:50%;right:6px;transform:translateY(-50%);background:none;border:0;padding:6px;margin:0;cursor:pointer;color:var(--muted);display:flex;border-radius:8px}
.pass-toggle:hover{color:var(--text)}
.pass-toggle svg{width:20px;height:20px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:.9rem;color:var(--muted);margin-top:14px}
.note.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--text)}
.note.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 35%,transparent);color:var(--text)}
.note svg{margin-top:2px}

/* Brand mark */
.logo{width:44px;height:44px;border-radius:13px;background:var(--brand-grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgb(177 8 24/35%)}
.logo svg{width:22px;height:22px}

/* App shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px}
.brand strong{display:block;font-size:1rem;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.78rem}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:.9rem}
.banner .btn{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;border:0;background:transparent;color:var(--muted);font-weight:620;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current=page]{background:var(--brand-50);color:var(--brand)}
.nav-badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--crit);color:#fff;font-size:.72rem;font-weight:750;text-align:center}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brand-50);color:var(--brand);font-weight:750;flex:none}
.me-info{min-width:0}
.me-info strong{display:block;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-info small{color:var(--muted);font-size:.76rem}
.side-actions{display:flex;gap:6px;padding:0 6px}
.side-actions label{flex:1;font-size:.76rem;color:var(--muted)}
.side-actions select{width:100%;margin-top:3px;padding:5px 8px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar h1{font-size:1.3rem;margin:0;letter-spacing:-.02em}
.topbar .spacer{flex:1}
.progress{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:.84rem;font-weight:600}
.pbar{width:90px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.content{padding:24px 28px 110px;width:100%;max-width:1560px}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--brand) 25%,transparent);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Summary bar */
.summary{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.sum-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-label{font-size:.82rem;font-weight:600;color:var(--muted)}
.sum-main strong{font-size:2rem;letter-spacing:-.03em;line-height:1.15}
.sum-main .muted{font-size:.86rem}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button b{color:var(--text);font-variant-numeric:tabular-nums}
.seg button.st-critical b,.seg button.st-warning b{color:var(--st,var(--s))}
.seg button.st-ok b{color:var(--ok-text)}
.sum-stats{display:flex;flex-wrap:wrap;gap:16px 44px}
button.sum-main{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
button.sum-main:hover .sum-link{text-decoration:underline}
.sum-link{color:var(--brand);font-weight:600;font-size:.86rem}
.range-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.date-ctl{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--muted);font-size:.88rem}
.date-ctl .input{width:auto;min-height:40px;padding:7px 10px}
.spend-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px;margin-top:16px;align-items:start}
.hbar-row{display:grid;grid-template-columns:minmax(80px,130px) 1fr auto;gap:12px;align-items:center;padding:10px 0;font-size:.9rem}
.hbar-row+.hbar-row{border-top:1px solid var(--border)}
.hbar-row b{font-variant-numeric:tabular-nums}
.hbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--muted);border-radius:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px;border-bottom:1px solid var(--border)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl small{display:block;color:var(--muted)}
.list-row .v.plus{color:var(--ok-text)}
.list-row .v.minus{color:var(--muted);font-weight:600}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgb(16 24 40/10%)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 4px}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{padding-left:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.86rem;font-weight:620;cursor:pointer;color:var(--muted)}
.chip-btn:hover{color:var(--text)}
.chip-btn[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--surface)}
.chip-btn .n{opacity:.7;margin-left:4px;font-weight:600}
.toolbar .right{display:flex;gap:8px;align-items:center;margin-left:auto}
.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:38px}
.toggle{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer}
.active-filter{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:99px;background:var(--sbg);color:var(--s);font-size:.84rem;font-weight:700}
.active-filter button{border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:2px;border-radius:50%}

/* Select several numbers and move them together */
.bulk-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.bulk-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.bulk-destination{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.86rem;font-weight:600;max-width:100%}
.bulk-destination select.input{width:220px;max-width:100%;min-width:0}
.bulk-tools p{margin:0;max-width:100%}
.card.is-selecting{cursor:default}
.card.is-selected{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
.card-select{display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 0 8px 8px;font-size:.8rem;color:var(--muted)}
.card-select input{width:20px;height:20px;accent-color:var(--brand);margin:0;cursor:pointer}

/* Group sections */
.group-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:26px 0 12px}
.group-head h2{font-size:1.05rem;margin:0;letter-spacing:-.01em}
.group-head .count{color:var(--muted);font-size:.86rem}
.group-head .mini{margin-left:auto;font-size:.86rem;color:var(--muted)}
.mini b{font-weight:650}
.mini .st-critical,.mini .st-warning{color:var(--st,var(--s))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr));gap:14px}

/* Account card */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px 19px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgb(16 24 40/6%),0 10px 26px rgb(16 24 40/10%)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--s)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-top h3{margin:0;font-size:1rem;letter-spacing:-.01em;line-height:1.25}
.card-top p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:.74rem;font-weight:750;background:var(--sbg);color:var(--s);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.promo-name{margin:-4px 0 0;font-size:.83rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gtag{padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:.74rem;font-weight:650}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.meter-label{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:650;color:var(--muted)}
.meter-label svg{width:15px;height:15px}
.meter-val strong{font-size:1rem;letter-spacing:-.01em}
.meter-val small{color:var(--muted);font-size:.78rem}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .6s ease}
.bar.striped i{opacity:.35}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--border);font-size:.82rem;color:var(--muted)}
.card-foot .load{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--text)}
.card-foot svg{width:15px;height:15px}
.card-reason{margin:0;font-size:.82rem;color:var(--muted)}
.busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px;font-weight:650;font-size:.9rem;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(2px)}
.card.is-busy .busy{display:flex}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);margin-top:20px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgb(10 12 16/45%);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(470px,100%);background:var(--surface);z-index:50;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgb(0 0 0/18%)}
.drawer.open{transform:none}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.drawer-head h2{margin:6px 0 2px;font-size:1.2rem;letter-spacing:-.02em}
.drawer-head p{margin:0;color:var(--muted)}
.drawer-head .btn{margin-left:auto}
.drawer-body{flex:1;overflow:auto;padding:4px 20px 20px}
.drawer-body h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.big-meters{display:grid;gap:16px;margin-top:16px;padding:16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border)}
.big-meters .meter-val strong{font-size:1.25rem}
.big-meters .bar{height:11px}
.list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;font-size:.9rem}
.list-row+.list-row{border-top:1px solid var(--border)}
.list-row small{display:block;color:var(--muted);font-size:.78rem}
.list-row .v{text-align:right;font-weight:700}
.list-row select{padding:6px 8px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px}
.drawer-foot .btn:first-child{flex:1}

/* Modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgb(10 12 16/50%);padding:16px}
.modal-box{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px;padding:24px;box-shadow:0 24px 60px rgb(0 0 0/30%)}
.modal-box h2{margin:0 0 4px;font-size:1.2rem;letter-spacing:-.02em}
.modal-box>p{margin:0;color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.stepper{display:flex;gap:6px;margin:14px 0 4px}
.stepper span{flex:1;height:5px;border-radius:99px;background:var(--border)}
.stepper span.on{background:var(--brand)}
.step-label{font-size:.8rem;color:var(--muted);font-weight:650}
.choice{border:0;padding:0;margin:16px 0 0;display:grid;gap:10px}
.choice legend{font-size:.85rem;font-weight:650;color:var(--muted);margin-bottom:6px}
.choice-card{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--border);border-radius:14px;cursor:pointer}
.choice-card:has(input:checked){border-color:var(--brand);background:var(--brand-50)}
.choice-card input{margin-top:4px;accent-color:var(--brand)}
.choice-card strong{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.choice-card small{display:block;color:var(--muted);margin-top:2px}
.choice-card .price{margin-left:auto;font-weight:800;color:var(--brand);white-space:nowrap}
.tag{font-style:normal;font-size:.78rem;font-weight:500;color:var(--muted)}
.center-busy{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;text-align:center}
.center-busy .spinner{width:34px;height:34px;border-width:4px}

/* Groups / users / settings */
.view-intro{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.view-intro p{margin:0;color:var(--muted);max-width:620px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form .input{width:auto;min-width:200px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.gcard{display:flex;flex-direction:column;gap:12px}
.gcard .input{font-weight:700;font-size:1rem}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack i{display:block;height:100%}
.stack .lvl-auth{background:var(--faint)}
.legend{font-size:.86rem;color:var(--muted)}
.gcard .actions{display:flex;gap:8px;margin-top:auto}
.users{display:flex;flex-direction:column}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 4px}
.user-row+.user-row{border-top:1px solid var(--border)}
.user-row .who{flex:1;min-width:0}
.user-row .who strong{display:block;overflow:hidden;text-overflow:ellipsis}
.user-row .who small{color:var(--muted)}
.user-row select{padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.roles div{padding:12px;border-radius:12px;background:var(--surface-2);font-size:.86rem;color:var(--muted)}
.roles strong{display:block;color:var(--text)}
.settings{display:grid;gap:16px;max-width:760px}
.panel h2{margin:0 0 4px;font-size:1.05rem}
.panel>p{margin:0 0 6px;color:var(--muted);font-size:.9rem}
.range-row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:12px 0}
.range-row+.range-row{border-top:1px solid var(--border)}
.range-row label{font-weight:650}
.range-row small{grid-column:1/-1;color:var(--muted)}
.range-row output{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.range-row input{grid-column:1/-1;accent-color:var(--brand);width:100%}

/* Toast */
.toast{position:fixed;left:50%;top:24px;transform:translate(-50%,-20px);background:#1b1d22;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:0 10px 30px rgb(0 0 0/30%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Bottom nav (mobile) */
.bottomnav{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .topbar{padding:12px 16px;flex-wrap:wrap;row-gap:8px}
  .topbar .btn .lbl{display:none}
  .topbar .progress{order:5;width:100%;justify-content:flex-start}
  .topbar .progress .pbar{flex:1}
  .content{padding:16px 14px 110px}
  .summary{padding:16px}
  .spend-grid{grid-template-columns:minmax(0,1fr)}
  .tbl .hide-sm{display:none}
  .seg{width:100%}
  .seg button{flex:1 1 auto;justify-content:center;padding:8px}
  .toolbar .right{margin-left:0;width:100%}
  .search{max-width:none}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
  .bottomnav .nav-item{flex-direction:column;gap:3px;font-size:.72rem;padding:7px 4px;justify-content:center;align-items:center;position:relative}
  .bottomnav .nav-badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;min-width:18px;padding:0 5px;font-size:.66rem}
  .drawer{top:auto;bottom:0;height:90%;width:100%;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .drawer.open{transform:none}
  .toast{top:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}

/* ---- Additions for the live app ---- */
.center-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
.center-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:var(--shadow);text-align:center}
.center-card .logo{margin:0 auto 14px}
.center-card h1{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.02em}
.center-card p{margin:0 0 16px;color:var(--muted)}
.card-err{margin:0;font-size:.8rem;color:var(--crit)}
.mt{margin-top:16px}
.pre{margin:14px 0 0;max-height:55vh;overflow:auto;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;text-align:left}
.captcha-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.captcha-row img{height:44px;border-radius:9px;border:1px solid var(--border);background:#fff;cursor:pointer}
.captcha-row .input{flex:1 1 140px;width:auto}
.link-btn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;font-size:.88rem}
.link-btn:hover{text-decoration:underline}
.inline-fields{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-fields .field{flex:1 1 200px}
.promo-list{display:grid;gap:10px;margin-top:14px;max-height:46vh;overflow:auto}
.small{font-size:.82rem}
.scroll-x{overflow-x:auto}
.inline-form select.input{width:auto}
.grid.flat{margin-top:16px}
.gcard h2{margin:0;font-size:1.05rem}
.center-busy p{margin:4px 0 0}
.modal-actions .btn.danger{background:var(--crit);color:#fff;border-color:var(--crit)}
.soon-tag{margin-left:auto;padding:1px 7px;border-radius:99px;border:1px solid var(--border);font-size:.68rem;font-weight:650;color:var(--muted)}
.nav-item .nav-badge+.soon-tag{margin-left:6px}
.sidebar .nav-item span:not(.nav-badge):not(.soon-tag){white-space:nowrap}

/* Visual dashboard and account organization */
:root{--radius:18px;--shadow:0 2px 8px rgb(16 24 40/3%);color-scheme:light}
[data-theme=dark]{color-scheme:dark;--shadow:0 2px 8px rgb(0 0 0/12%)}
.topbar{padding:23px 32px;gap:10px}
.page-title{min-width:0}
.eyebrow{display:block;font-size:.65rem;letter-spacing:.16em;font-weight:700;color:var(--muted);margin-bottom:4px}
.topbar h1{font-size:1.65rem;font-weight:650;letter-spacing:-.04em}
.content{padding:28px 32px 110px}
.sidebar{padding-top:26px}
.nav{gap:6px;margin-top:10px}
.nav-item{min-height:46px}
.summary{display:block;padding:0;overflow:hidden}
.sum-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.sum-stats .sum-main{padding:24px;gap:8px}
.sum-stats .sum-main+.sum-main{border-left:1px solid var(--border)}
.sum-main strong{font-size:2.15rem;font-weight:650;line-height:1.2}
.sum-main strong small{font-size:.95rem;letter-spacing:0;font-weight:500;color:var(--muted)}
.sum-label{font-size:.84rem}
.sum-main .muted{font-size:.8rem;line-height:1.6}
.summary .seg{border:0;border-top:1px solid var(--border);border-radius:0;background:transparent;padding:12px 16px;gap:6px}
.summary .seg button[aria-pressed=true]{background:var(--surface-2);box-shadow:none}
.toolbar{margin:24px 0 18px;gap:12px}
.toolbar .right{flex-wrap:wrap}
.chip-btn{min-height:40px}
.grid{gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.card{padding:22px;gap:17px;min-width:0}
.card-top>div{min-width:0}
.card-top h3{font-size:1.1rem;font-weight:650;overflow-wrap:anywhere}
.card-top p{font-size:.86rem;margin-top:5px}
.account-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.health-pill{display:inline-flex;gap:6px;align-items:center;font-size:.74rem;font-weight:650;padding:4px 8px;border-radius:7px;color:var(--st,var(--s));background:var(--sbg)}
.health-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.health-pill.st-ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok-text)}
.promo-name{line-height:1.5;font-size:.86rem;min-height:2.6em;margin:0}
.meter-head{align-items:flex-start}
.meter-val{text-align:right;display:flex;flex-direction:column;gap:2px}
.meter-val strong{font-size:1.16rem;font-weight:700}
.meter-val small{font-size:.76rem}
.bar{height:10px}
.bar.striped i{opacity:.6}
.card-foot{flex-wrap:wrap;font-size:.77rem;margin-top:auto}
.card-select{min-height:44px;padding:0 0 0 5px}
.card-select span{display:none}
.card-details{align-self:flex-start}
.bulk-tools{border-radius:14px;background:var(--surface-2);border-color:var(--border);padding:14px 16px;margin:0 0 18px}

.group-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}

.group-toolbar .search{max-width:360px}

.gcard{padding:22px;gap:14px;min-width:0}
.gcard.ungrouped{border-style:dashed}
.gcard-head{display:flex;gap:12px;align-items:center;min-width:0}
.gcard-head>div{min-width:0}
.gcard h2{overflow-wrap:anywhere;font-size:1.1rem}

.group-total{display:flex;align-items:baseline;gap:9px}

.gcard .stack{height:7px}

.member-preview>span{display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}
.member-preview svg{width:15px;height:15px}
.member-preview small{padding-left:23px}
.group-expiry{margin:0;line-height:1.5;min-height:2.8em}
.gcard .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border-top:1px solid var(--border);padding-top:16px;margin-top:auto}
.gcard .actions .btn{min-height:42px;white-space:normal;padding:8px;font-size:.8rem}
.group-menu{position:relative;margin-left:auto;flex:none}
.group-menu summary{display:grid;place-items:center;list-style:none;cursor:pointer;color:var(--muted);width:38px;height:38px;border-radius:9px}
.group-menu summary::-webkit-details-marker{display:none}
.group-menu summary:hover{background:var(--surface-2)}
.menu{position:absolute;right:0;top:42px;min-width:170px;background:var(--surface);border:1px solid var(--border);padding:5px;border-radius:11px;z-index:10;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px;border-radius:7px;text-align:left;cursor:pointer;font-size:.86rem}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--crit)}
.create-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:330px;padding:24px;border:1px dashed var(--border);border-radius:var(--radius);background:none;color:var(--muted);cursor:pointer}
.create-tile:hover{background:var(--surface);border-color:var(--brand)}
.create-icon{display:grid;place-items:center;background:var(--surface-2);color:var(--text);width:44px;height:44px;border-radius:50%}
.create-tile strong{color:var(--text);font-size:1rem}
.create-tile>span:last-child{font-size:.84rem;max-width:200px;line-height:1.7;text-align:center}
.page-note{color:var(--muted);font-size:.84rem;line-height:1.6;margin:22px 0 0}
.group-editor{width:min(620px,100%)}
.editor-heading{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.editor-heading p{margin:7px 0 0;font-size:.87rem;line-height:1.6}
.editor-heading .btn{flex:none}
.picker-heading{display:flex;justify-content:space-between;gap:12px;margin:23px 0 12px;font-size:.9rem}
.picker-heading>span{color:var(--muted);font-size:.84rem}
.picker-search{max-width:none}
.picker-tools{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:12px 0}
.picker-tools .chip-btn{padding:7px 10px;font-size:.8rem}
.picker-tools .link-btn{font-size:.8rem;min-height:40px}
.account-picker{max-height:290px;overflow:auto;border:1px solid var(--border);border-radius:12px;overscroll-behavior:contain}
.picker-account{display:flex;align-items:center;gap:11px;padding:12px;cursor:pointer;min-height:70px}
.picker-account+.picker-account{border-top:1px solid var(--border)}

.picker-account input{width:19px;height:19px;accent-color:var(--brand);flex:none;margin:0}
.picker-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--muted);flex:none}
.picker-copy{min-width:0;flex:1}
.picker-copy strong{display:block;font-size:.86rem;overflow-wrap:anywhere}
.picker-copy small{display:block;font-size:.77rem;color:var(--muted);margin-top:3px}
.picker-account .gtag{max-width:125px;overflow-wrap:anywhere;flex-shrink:1}
.picker-note{line-height:1.6;margin:12px 0 0}
.group-editor .modal-actions{position:sticky;bottom:-24px;margin-left:-24px;margin-right:-24px;padding:16px 24px;background:var(--surface);border-top:1px solid var(--border)}
.mobile-more{flex:1;min-width:0;position:relative}
.mobile-menu{position:absolute;bottom:calc(100% + 12px);right:0;min-width:210px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:8px;box-shadow:0 12px 40px rgb(0 0 0/18%)}
.bottomnav .mobile-menu .nav-item{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px;font-size:.85rem;min-height:44px}
.mobile-menu .soon-tag{margin-left:auto}

.dashboard-metric{border:1px solid var(--border);border-radius:15px;padding:19px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:9px;min-width:0;cursor:pointer;color:var(--text)}
.dashboard-metric:hover{border-color:var(--muted)}
.dashboard-metric[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.dashboard-metric>span{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.dashboard-metric>span svg{width:17px;height:17px}

.dashboard-metric small{font-size:.75rem;color:var(--muted);line-height:1.6}

.dashboard-column{display:grid;gap:20px;min-width:0}
.dashboard-panel{padding:22px;box-shadow:none}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.section-heading h2{margin:0;font-size:1rem;font-weight:650;letter-spacing:-.02em}
.section-heading p{margin:6px 0 0;font-size:.78rem;line-height:1.65;color:var(--muted)}
.section-heading>.link-btn{flex:none}

.attention-row:first-child{border-top:0;padding-top:0}
.attention-icon{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn-text);flex:none}

.attention-copy{min-width:0;flex:1}

.attention-row>.link-btn{flex:none;min-height:36px;display:flex;align-items:center;gap:4px;text-align:right}

.renewal-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border);padding:14px 0}

.renewal-row strong{display:block;font-size:.86rem;font-weight:600;overflow-wrap:anywhere}
.renewal-row small{display:block;font-size:.73rem;color:var(--muted);margin-top:5px}
.renewal-end{text-align:right;flex:none}

.renewal-end .link-btn{margin-top:5px;display:flex;gap:4px;font-size:.75rem;align-items:center;justify-content:flex-end}
.dashboard-group{display:flex;gap:12px;align-items:center;border-top:1px solid var(--border);padding:16px 0}

        plan:{offerId,day,auto,version:1,dateSource:connection==='unconnected'?'planned':'provider',resumeRequested:false},futurePlan:null};
    });
    const history=[['sim-001',-30],['sim-004',-27],['sim-003',-28],['sim-008',-19]].map(([id,day],i)=>{
      const sim=sims.find(a=>a.id===id),offer=offers.find(o=>o.id===sim.current.offerId);
      return {id:'DEMO-'+(1001+i),simId:id,siteName:sim.name,managerId:sim.managerId,offerId:offer.id,price:offer.price,status:'delivered',day,planVersion:1,walletReflected:true,reference:'SAMPLE-'+(1001+i)};
    });
    return {at,baseDay,role:'admin',managerId:'north',page:'overview',simId:null,tab:'overview',period:7,reserve:500,wallet:2440,
      search:'',simFilter:'all',queueFilter:'upcoming',portfolioFilter:'all',historyFilter:'all',historyType:'all',
      catalog:offers.map(o=>({...o,enabled:true})),managers:managers.map(m=>({...m})),sims,orders:history,
      funding:[{id:'FUND-DEMO-1',day:-35,amount:5000,label:'Manual wallet funding',source:'Sample confirmed credit'}],
      limits:{perSIM:1000,perManager:5000,daily:5000},drafts:{},audit:[],notifications:{renewals:true,results:true},nextId:11};
  }
  const offer=(s,id)=>s.catalog.find(o=>o.id===id);
  const manager=(s,id)=>s.managers.find(m=>m.id===id);
  const sim=(s,id)=>s.sims.find(a=>a.id===id);
  const canSee=(s,a)=>Boolean(a)&&(s.role==='admin'||a.managerId===s.managerId);
  const visibleSims=s=>s.sims.filter(a=>canSee(s,a));
  const visibleOrders=s=>s.orders.filter(o=>s.role==='admin'||o.managerId===s.managerId);
  const inFlight=(s,a)=>s.orders.find(o=>o.simId===a.id&&['submitting','pending','unknown'].includes(o.status));
  function actor(s){return s.role==='admin'?'Supplier Admin':manager(s,s.managerId)?.name||'Account Manager';}
  function audit(s,a,action,detail){s.audit.unshift({id:'change-'+(s.audit.length+1),simId:a?.id||null,managerId:a?.managerId||null,actor:actor(s),action,detail,at:Date.now()});}
  function planStatus(s,a){
    if(a.assignment!=='assigned')return {key:'assignment',label:'Awaiting assignment',tone:'warning',reason:'Supplier Admin needs to confirm the portfolio.'};
    if(inFlight(s,a))return {key:'checking',label:'Needs checking',tone:'warning',reason:'An existing supply attempt must be resolved before another is created.'};
    if(!a.plan.offerId)return {key:'no-plan',label:'Choose a promo',tone:'warning',reason:'A next-promo preference has not been saved.'};
    const o=offer(s,a.plan.offerId);
    if(!o||!o.enabled)return {key:'review',label:'Offer needs review',tone:'warning',reason:'The selected offer is not in the enabled sample catalog.'};
    if(!a.plan.auto)return {key:'paused',label:a.plan.resumeRequested?'Resume requested':'Paused',tone:'neutral',reason:'Future automatic renewals are paused.'};
    if(!Number.isInteger(a.plan.day))return {key:'unscheduled',label:'Set renewal date',tone:'warning',reason:'The funding forecast needs a known or explicitly planned renewal date.'};
    if(o.price>s.limits.perSIM)return {key:'review',label:'Budget review',tone:'warning',reason:'The selected offer exceeds the supplier per-SIM limit.'};
    return {key:'scheduled',label:'Scheduled',tone:'success',reason:a.plan.dateSource==='planned'?'Uses an explicitly planned date.':'Uses the saved expiry date.'};
  }
  function events(s,horizon=s.period){
    const result=[];
    for(const a of s.sims){
      if(a.assignment!=='assigned'||!a.plan.auto||!Number.isInteger(a.plan.day)||a.plan.day<0||inFlight(s,a))continue;
      const o=offer(s,a.plan.offerId);if(!o||!Number.isFinite(o.price)||o.days<=0)continue;
      for(let day=a.plan.day;day<horizon;day+=o.days)result.push({simId:a.id,managerId:a.managerId,day,price:o.price,offerId:o.id,status:planStatus(s,a)});
    }
    return result.sort((a,b)=>a.day-b.day||a.simId.localeCompare(b.simId));
  }
  function forecast(s,horizon=s.period){
    const upcoming=events(s,horizon),cost=upcoming.reduce((n,e)=>n+e.price,0);
    const held=s.orders.filter(o=>['submitting','pending','unknown'].includes(o.status)&&!o.walletReflected).reduce((n,o)=>n+o.price,0);
    let remaining=s.wallet-held,reserveDay=remaining<s.reserve?0:null,uncoveredDay=null;
    for(const e of upcoming){remaining-=e.price;if(remaining<s.reserve&&reserveDay===null)reserveDay=e.day;if(remaining<0&&uncoveredDay===null)uncoveredDay=e.day;}
    const missing=s.sims.filter(a=>a.assignment==='assigned'&&a.plan.auto&&(!a.plan.offerId||!Number.isInteger(a.plan.day)||inFlight(s,a)));
    return {upcoming,cost,held,remaining,reserveDay,uncoveredDay,missing,topup:Math.ceil(Math.max(0,cost+held+s.reserve-s.wallet)/100)*100};
  }
  function budgetWarnings(s){
    const warnings=[],planned=events(s,30),daily=new Map(),byManager=new Map();
    for(const e of planned){daily.set(e.day,(daily.get(e.day)||0)+e.price);byManager.set(e.managerId,(byManager.get(e.managerId)||0)+e.price);}
    for(const [day,total] of daily)if(total>s.limits.daily)warnings.push({kind:'daily',day,total,limit:s.limits.daily});
    for(const [managerId,total] of byManager)if(total>s.limits.perManager)warnings.push({kind:'manager',managerId,total,limit:s.limits.perManager});
    return warnings;
  }
  function savePlan(s,id,offerId,reason=''){
    const a=sim(s,id),o=offer(s,offerId);
    if(!canSee(s,a))return {ok:false,error:'This SIM is outside your portfolio.'};
    if(!o?.enabled)return {ok:false,error:'Choose an enabled sample offer.'};
    if(a.validation!=='sample-valid')return {ok:false,error:'Recipient validation is pending. No eligible catalog is established yet.'};
    if(s.role==='admin'&&a.plan.offerId!==offerId&&!String(reason).trim())return {ok:false,error:'Add a reason for this supplier override.'};
    const locked=inFlight(s,a);
    if(locked){a.futurePlan={offerId,version:a.plan.version+1};audit(s,a,'Following renewal preference saved',o.name+' · current attempt unchanged');return {ok:true,following:true};}
    const old=offer(s,a.plan.offerId)?.name||'No saved promo';
    if(a.plan.offerId===offerId)return {ok:true,unchanged:true};
    a.plan.offerId=offerId;a.plan.version++;audit(s,a,'Next promo changed',old+' → '+o.name+(s.role==='admin'?' · '+String(reason).trim().slice(0,160):''));
    delete s.drafts[id];return {ok:true,review:o.price>s.limits.perSIM};
  }
  function pause(s,id){
    const a=sim(s,id);if(!canSee(s,a))return {ok:false,error:'This SIM is outside your portfolio.'};
    a.plan.auto=false;a.plan.resumeRequested=false;a.plan.version++;audit(s,a,'Future renewals paused','Any attempt already in progress is unchanged.');return {ok:true};
  }
  function resume(s,id){
    const a=sim(s,id);if(!canSee(s,a))return {ok:false,error:'This SIM is outside your portfolio.'};
    if(s.role==='manager'){a.plan.resumeRequested=true;audit(s,a,'Resume requested','Awaiting supplier review.');return {ok:true,requested:true};}
    if(a.assignment!=='assigned'||!offer(s,a.plan.offerId)?.enabled||!Number.isInteger(a.plan.day))return {ok:false,error:'Confirm assignment, an enabled promo and a renewal date first.'};
    if(offer(s,a.plan.offerId).price>s.limits.perSIM)return {ok:false,error:'The selected promo exceeds the per-SIM limit.'};
    a.plan.auto=true;a.plan.resumeRequested=false;a.plan.version++;audit(s,a,'Automatic renewal enabled','Supplier rule enabled in this preview.');return {ok:true};
  }
  function setDate(s,id,day,source='planned'){
    const a=sim(s,id);if(s.role!=='admin'||!a)return {ok:false,error:'Only Supplier Admin sets the execution schedule.'};
    if(!Number.isInteger(day)||day<0||day>365)return {ok:false,error:'Choose a date within the next year.'};
    if(inFlight(s,a))return {ok:false,error:'Resolve the existing attempt before changing its schedule.'};
    a.plan.day=day;a.plan.dateSource=source==='provider'&&a.current?.expiryDay===day?'provider':'planned';a.plan.version++;audit(s,a,'Renewal date set',(a.plan.dateSource==='provider'?'Saved expiry day ':'Explicit planned day ')+day);return {ok:true};
  }
  function assign(s,id,managerId){
    const a=sim(s,id);if(s.role!=='admin'||!a||!manager(s,managerId))return {ok:false,error:'Only Supplier Admin can assign SIMs.'};
    if(inFlight(s,a))return {ok:false,error:'Resolve the current supply attempt before transferring this SIM.'};
    const previous=a.managerId;a.managerId=managerId;a.assignment='assigned';audit(s,a,'Portfolio assignment confirmed',(manager(s,previous)?.portfolio||'Unassigned')+' → '+manager(s,managerId).portfolio);return {ok:true};
  }
  function addSIM(s,{name,suffix,managerId,sample}){
    const target=s.role==='manager'?s.managerId:managerId;
    if(!manager(s,target))return {ok:false,error:'Choose a manager portfolio.'};
    if(!String(name).trim()||!/^\d{4}$/.test(String(suffix)))return {ok:false,error:'Provide a site name and a valid sample or formatted number.'};
    // Only a masked suffix is kept in this prototype; no raw number is retained.
    if(s.sims.some(a=>a.suffix===suffix))return {ok:false,error:'That sample number is already registered. Assignment changes require Supplier Admin.'};
    const a={id:'sim-'+String(s.nextId++).padStart(3,'0'),name:String(name).trim().slice(0,70),suffix,managerId:target,assignment:s.role==='admin'?'assigned':'pending',validation:sample?'sample-valid':'provider-pending',connection:{status:'unconnected',checkedAt:null},current:null,plan:{offerId:null,day:null,auto:false,version:1,dateSource:'planned',resumeRequested:false},futurePlan:null};
    s.sims.push(a);audit(s,a,'SIM submitted',a.assignment==='pending'?'Awaiting supplier assignment.':'Registered in the selected portfolio.');return {ok:true,sim:a};
  }
  function topup(s,amount){
    if(s.role!=='admin'||!Number.isInteger(amount)||amount<1||amount>100000)return {ok:false,error:'Enter a whole demo amount from ₱1 to ₱100,000.'};
    s.wallet+=amount;s.funding.unshift({id:'FUND-DEMO-'+(s.funding.length+1),day:0,amount,label:'Demo manual top-up',source:'Preview credit only'});audit(s,null,'Demo wallet credit recorded','Added '+amount+' to the sample balance.');return {ok:true};
  }
  function setLimit(s,key,value){
    if(s.role!=='admin'||!['perSIM','perManager','daily'].includes(key)||!Number.isInteger(value)||value<0||value>1000000)return {ok:false,error:'Use a whole, non-negative sample limit up to ₱1,000,000.'};
    s.limits[key]=value;audit(s,null,'Spending rule updated',key+' = '+value);return {ok:true};
  }
  function setReserve(s,value){
    if(s.role!=='admin'||!Number.isInteger(value)||value<0||value>100000)return {ok:false,error:'Use a whole reserve from ₱0 to ₱100,000.'};
    s.reserve=value;audit(s,null,'Wallet reserve updated','Reserve = '+value);return {ok:true};
  }
  function catalogToggle(s,id){
    const o=offer(s,id);if(s.role!=='admin'||!o)return {ok:false,error:'Only Supplier Admin manages the catalog.'};
    o.enabled=!o.enabled;audit(s,null,'Sample catalog updated',o.name+' '+(o.enabled?'enabled':'disabled'));return {ok:true};
  }
  function issues(s){
    const f=forecast(s),result=[];
    if(f.topup)result.push({id:'funding',type:'funding',title:'Prepare '+f.topup+' in load',detail:'A top-up protects the selected renewal window and reserve.',action:'wallet'});
    for(const a of s.sims){
      const status=planStatus(s,a);
      if(['assignment','checking','no-plan','unscheduled','review'].includes(status.key)||a.plan.resumeRequested)result.push({id:a.id,type:status.key,simId:a.id,title:a.plan.resumeRequested?'Resume requested':status.label,detail:a.name,action:'sim'});
    }
    for(const w of budgetWarnings(s))result.push({id:w.kind+(w.day??w.managerId),type:'budget',title:w.kind==='daily'?'Daily limit needs review':'Manager budget needs review',detail:w.kind==='daily'?'Planned day '+w.day:manager(s,w.managerId).name,action:'settings'});
    return result;
  }
  const model={DAY,offers,managers,createState,offer,manager,sim,canSee,visibleSims,visibleOrders,inFlight,planStatus,events,forecast,budgetWarnings,savePlan,pause,resume,setDate,assign,addSIM,topup,setLimit,setReserve,catalogToggle,issues};
  root.DVendoDemo=Object.freeze(model);
  if(typeof module!=='undefined'&&module.exports)module.exports=root.DVendoDemo;
})(globalThis);

<script>
/* Standalone interactive design preview. All actions stay in browser memory. */
(() => {
  'use strict';
  const M=DVendoDemo,s=M.createState(),$=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cash=n=>'₱'+Number(n).toLocaleString('en-PH',{maximumFractionDigits:0});
  const date=d=>Number.isInteger(d)?new Date(s.baseDay+d*M.DAY).toLocaleDateString('en-GB',{month:'short',day:'numeric',timeZone:'UTC'}):'Not set';
  const dateInput=d=>Number.isInteger(d)?new Date(s.baseDay+d*M.DAY).toISOString().slice(0,10):'';
  const relative=d=>d===0?'Today':d===1?'Tomorrow':Number.isInteger(d)?`In ${d} days`:'Date needed';
  const initials=name=>name.split(' ').map(n=>n[0]).slice(0,2).join('');
  const paths={
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18m-5 5h2M6 6V3h12v3"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    sim:'<path d="M7 3h9l4 4v14H4V6z"/><rect x="8" y="10" width="8" height="7" rx="1"/><path d="M12 10v7m-4-3h8"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-14a3 3 0 0 1 0 6m2 3a5 5 0 0 1 2 5"/>',
    bag:'<path d="m5 3-2 5v13h18V8l-2-5H5ZM3 8h18m-13 4a4 4 0 0 0 8 0"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',
    history:'<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v5l3 2"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    arrow:'<path d="M4 12h15m-5-5 5 5-5 5"/>',
    chevron:'<path d="m9 5 7 7-7 7"/>',
    back:'<path d="M20 12H5m5-5-5 5 5 5"/>',
    search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    alert:'<path d="m12 3 10 18H2L12 3Zm0 6v5m0 3v.1"/>',
    moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',
    bell:'<path d="M4 17h16l-2-3V9a6 6 0 0 0-12 0v5l-2 3Zm6 3h4"/>',
    pause:'<path d="M8 5v14M16 5v14"/>',
    refresh:'<path d="M20 7v5h-5M4 17v-5h5M5.5 7a7 7 0 0 1 12-2L20 8M4 16l2.5 3a7 7 0 0 0 12-2"/>',
    dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',
    link:'<path d="m9 15 6-6M7 17l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m6 0 1-1a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(2 0) scale(.85 1)"/>'
  };
  const icon=n=>`<svg class="d-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.grid}</svg>`;
  const pill=(text,tone='neutral')=>`<span class="d-pill ${tone}"><i></i>${esc(text)}</span>`;
  const button=(label,action,attrs='',kind='secondary',symbol='')=>`<button type="button" class="d-button ${kind}" data-action="${action}" ${attrs}>${symbol?icon(symbol):''}${label}</button>`;
  const navButton=(label,page,kind='secondary',symbol='')=>button(label,'nav',`data-page="${page}"`,kind,symbol);
  const empty=(title,copy,symbol='sim',action='')=>`<div class="d-empty"><span>${icon(symbol)}</span><h3>${title}</h3><p>${copy}</p>${action}</div>`;
  const sectionHead=(title,copy='',action='')=>`<div class="d-section-head"><div><h2>${title}</h2>${copy?`<p>${copy}</p>`:''}</div>${action}</div>`;
  const metric=(label,value,copy,symbol)=>`<article class="d-metric"><span>${label}${icon(symbol)}</span><strong>${value}</strong><small>${copy}</small></article>`;
  const simButton=(a,tab='overview')=>`<button class="d-name-button" type="button" data-action="open-sim" data-id="${a.id}" data-tab="${tab}">${esc(a.name)}</button>`;
  const managerName=id=>M.manager(s,id)?.name||'Unassigned';
  const allowedManager=['overview','sims','plans','history','settings','sim'];
  const pages={overview:'Supply overview',renewals:'Renewal queue',sims:'Managers & SIMs',catalog:'Promo catalog',history:'History',settings:'Settings',wallet:'Funding plan',plans:'Promo plans'};
  let returnPage='overview',toastTimer,modalReturn=null;

  function notify(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4200);}
  function result(r,message){if(!r.ok){notify(r.error);return false;}notify(message);return true;}
  function modal(html){modalReturn=document.activeElement;$('#dialogBody').innerHTML=html;$('#dialog').showModal();}
  function closeModal(){if($('#dialog').open)$('#dialog').close();}
  function modalHead(title){return `<div class="d-modal-head"><h2 id="dialogTitle">${title}</h2>${button('×','close-modal','aria-label="Close dialog"','icon-only')}</div>`;}
  function connection(a){return a.connection.status==='unconnected'?pill('Not connected'):a.connection.status==='stale'?pill('Check is stale','warning'):pill('Connected','success');}
  function planPill(a){const st=M.planStatus(s,a);return pill(st.label,st.tone);}
  function dateText(a){return Number.isInteger(a.plan.day)?`${date(a.plan.day)}<small>${a.plan.dateSource==='planned'?'Planned date':relative(a.plan.day)}</small>`:'<span class="d-muted">Not scheduled</span>';}
  function periodControl(){return `<div class="d-segments" aria-label="Forecast period">${[7,14,30].map(n=>`<button type="button" data-action="period" data-days="${n}" aria-pressed="${s.period===n}">${n} days</button>`).join('')}</div>`;}
  function graph(f){
    const compact=matchMedia('(max-width:650px)').matches,count=compact?4:s.period===7?7:s.period===14?7:6,step=Math.ceil(s.period/count);
    const bars=Array.from({length:count},(_,i)=>({day:i*step,total:f.upcoming.filter(e=>e.day>=i*step&&e.day<(i+1)*step).reduce((sum,e)=>sum+e.price,0)})),max=Math.max(1,...bars.map(b=>b.total));
    return `<div class="d-forecast-chart" role="img" aria-label="Planned renewal cost: ${esc(bars.map(b=>date(b.day)+' '+cash(b.total)).join(', '))}">${bars.map(b=>`<div><span>${b.total?cash(b.total):'—'}</span><i style="height:${Math.max(2,b.total/max*80)}px"></i><small>${s.period===7&&!compact?new Date(s.baseDay+b.day*M.DAY).toLocaleDateString('en',{weekday:'short',timeZone:'UTC'}):date(b.day)}</small></div>`).join('')}</div><p class="d-chart-key">${compact?'Grouped totals · up to '+step+' days per bar':s.period===7?'Daily renewal totals':step+'-day totals'}</p>`;
  }
  function coverage(f){return f.missing.length?`<span>${icon('alert')}${f.missing.length} SIM${f.missing.length===1?' needs':'s need'} a plan, date or resolved attempt. Their unknown future cost is not included.</span>`:`<span>${icon('check')}All enabled SIM plans have dates.</span>`;}
  function fundingCard(){const f=M.forecast(s);return `<section class="d-panel d-funding">${sectionHead('Plan your next top-up','Upcoming renewals across all managers',periodControl())}<div class="d-funding-body"><div><span class="d-eyebrow">RECOMMENDED LOAD TO ADD</span><strong id="fundingEstimate">${cash(f.topup)}</strong><p>${f.topup?`Prepare by <b>${date(f.reserveDay??0)}</b> to protect your reserve.`:'Your wallet covers this window and your reserve.'}</p>${button('View funding plan','nav','data-page="wallet"','primary','arrow')}</div><div class="d-funding-math"><div><span>Planned promos</span><strong>${cash(f.cost)}</strong></div>${f.held?`<div><span>Protected pending amount</span><strong>${cash(f.held)}</strong></div>`:''}<div><span>Keep as reserve</span><strong>${cash(s.reserve)}</strong></div><div><span>Wallet balance</span><strong>− ${cash(s.wallet)}</strong></div></div></div>${graph(f)}<div class="d-coverage">${coverage(f)}<small>Rounded up to ₱100 · planned cost can include offers needing review</small></div></section>`;}
  function attention(){const issues=M.issues(s).slice(0,3);return `<section class="d-panel">${sectionHead('Needs attention',`${M.issues(s).length} items to keep supply moving`,button('View all','notifications','','text','arrow'))}<div class="d-attention-list">${issues.map(i=>`<button type="button" data-action="issue" data-issue="${i.id}" class="d-attention-item"><span class="d-attention-icon">${icon(i.type==='funding'?'wallet':'alert')}</span><span><strong>${i.type==='funding'?'Wallet top-up needed':esc(i.title)}</strong><small>${i.type==='funding'?'Prepare '+cash(M.forecast(s).topup)+' for upcoming renewals':esc(i.detail)}</small></span>${icon('chevron')}</button>`).join('')||empty('All clear','No open supply issues.','check')}</div><div class="d-quiet-note">${icon('clock')}The queue updates when plans, dates or funds change.</div></section>`;}

  function managerCard(a){const c=a.current,o=M.offer(s,a.plan.offerId);return `<article class="d-panel d-sim-card"><div class="d-card-top"><span class="d-site-icon">${icon('sim')}</span>${planPill(a)}</div><h3>${simButton(a)}</h3><p class="d-muted">•••• ${a.suffix}</p>${c?`<div class="d-sim-data"><strong>${c.unlimited?'Unlimited':c.remainingGB.toFixed(1)+' GB'}</strong><span>${c.unlimited?'High-speed data':`of ${c.totalGB} GB remaining`}</span></div>${!c.unlimited?`<div class="d-data-track"><i style="width:${Math.min(100,c.remainingGB/c.totalGB*100)}%"></i></div>`:''}<div class="d-card-fact"><span>Current promo ends</span><b>${date(c.expiryDay)}</b></div>`:`<div class="d-unconnected">${icon('link')}<strong>Monitoring not connected</strong><span>You can still choose a supply plan.</span></div>`}<div class="d-card-plan"><span>Next renewal</span><strong>${o?esc(o.name):'Choose a promo'}</strong><small>${Number.isInteger(a.plan.day)?date(a.plan.day):'Supplier needs to confirm the date'} · ${a.plan.auto?'Automatic plan':'Paused'}</small></div>${button('Manage SIM','open-sim',`data-id="${a.id}"`,'secondary full','arrow')}</article>`;}

    if(form.id==='scheduleForm'){const day=(Date.parse(data.get('date')+'T00:00:00Z')-s.baseDay)/M.DAY;if(result(M.setDate(s,form.dataset.id,day),'Planned renewal date saved.'))render();}
    if(form.id==='settingsForm'){const values=Object.fromEntries(['reserve','perSIM','perManager','daily'].map(k=>[k,Number(data.get(k))]));if(Object.values(values).some(v=>!Number.isInteger(v)||v<0)||values.reserve>100000||[values.perSIM,values.perManager,values.daily].some(v=>v>1000000)){$('#settingsError').textContent='Use whole, non-negative amounts within the displayed limits.';return;}for(const key of ['perSIM','perManager','daily'])M.setLimit(s,key,values[key]);M.setReserve(s,values.reserve);render();notify('Sample reserve and spending limits saved.');}
    if(form.id==='addSIMForm'){if(!form.dataset.suffix||form.dataset.checkedValue!==String(data.get('number')).trim()){$('#addSIMError').textContent='Check the number first.';return;}const r=M.addSIM(s,{name:data.get('name'),suffix:form.dataset.suffix,sample:form.dataset.sample==='yes',managerId:data.get('manager')});if(!r.ok){$('#addSIMError').textContent=r.error;return;}closeModal();openSIM(r.sim.id);notify(s.role==='manager'?'Sample SIM submitted for supplier assignment.':'Sample SIM added. Choose a promo and renewal date next.');}
  });
  $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  $('#dialog').addEventListener('close',()=>{if(modalReturn?.isConnected)modalReturn.focus();else $('#pageTitle').focus({preventScroll:true});});
  document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)||!e.target.closest('[role="tablist"]'))return;const tabs=$$('[role="tab"]'),index=tabs.indexOf(e.target);e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();});
  window.addEventListener('popstate',readRoute);
  matchMedia('(max-width:650px)').addEventListener('change',()=>{if(['overview','wallet'].includes(s.page))render();});
  $('#previewManager').innerHTML=s.managers.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.portfolio)}</option>`).join('');
  const params=new URLSearchParams(location.search);if(params.get('role')==='manager'){s.role='manager';if(s.managers.some(m=>m.id===params.get('manager')))s.managerId=params.get('manager');}
  readRoute();
  globalThis.DVendoPreview={state:s,model:M,render,navigate,openSIM};
})();

</script>
</body></html>
