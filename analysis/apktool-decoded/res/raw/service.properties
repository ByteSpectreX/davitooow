#################### 匹配app登录包名####################
###### 不同app登录时涉及的登录方式不同，部分app登录仅需要调用登录接口即可，部分app在调用完登录接口后需要调用用户身份和用户描述接口后才算正确登录#######
LOGIN_RULE_SINGLE = com.econet.yomix
#####  登录完成后调用userRule ####
LOGIN_USER_RULE = com.iwhalecloud.libyana
#####  登陆完成后屌用uc的识别用户接口 #####
LOGIN_USER_RULE_4_UC = com.econet.yomix
#####  登录完成后调用userRel接口    ####
LOGIN_USER_REL = com.iwhalecloud.clp
####  登陆强制调用subsList ####
LOGIN_QUERY_SUBS_LIST = com.iwhalecloud.clp
####  登陆强制调用subsList和subsDetail ####
LOGIN_QUERY_SUBS_LIST_DETAIL =
#####  app升级接口使用的appCode入参   #####
UPGRADE_APP_CODE = Libyana
##### app主页面 #####
APP_HOME_PAGE = MainActivity
####  i18默认语言 ####
I18_LANGUAGE = en

